<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Monogram Logo -->
  <g transform="translate(100, 100)">
    <rect width="70" height="70" rx="16" fill="#0b1329" stroke="#0ea5e9" stroke-width="2" />
    <text x="35" y="47" fill="#38bdf8" font-size="34" font-family="monospace" font-weight="bold" text-anchor="middle">A</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(190, 115)">
    <rect width="320" height="40" rx="20" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <text x="160" y="25" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">SENIOR SOFTWARE ENGINEER</text>
  </g>

  <!-- Headline -->
  <text x="100" y="260" fill="#f8fafc" font-size="52" font-family="sans-serif" font-weight="900">
    Ankit Aradhey
  </text>
  <text x="100" y="325" fill="url(#cyanGrad)" font-size="52" font-family="sans-serif" font-weight="900">
    Senior Software Engineer
  </text>

  <!-- Subtitle -->
  <text x="100" y="400" fill="#94a3b8" font-size="22" font-family="sans-serif">
    12+ years of enterprise experience with .NET and Microsoft Azure.
  </text>
  <text x="100" y="435" fill="#94a3b8" font-size="22" font-family="sans-serif">
    Software engineering, platform modernization, and applied AI. Based in Pune, India.
  </text>

  <!-- Tags Footer -->
  <g transform="translate(100, 500)">
    <rect width="130" height="36" rx="8" fill="#1e293b" />
    <text x="65" y="23" fill="#cbd5e1" font-size="14" font-family="monospace" text-anchor="middle">.NET</text>
  </g>
  <g transform="translate(245, 500)">
    <rect width="180" height="36" rx="8" fill="#1e293b" />
    <text x="90" y="23" fill="#cbd5e1" font-size="14" font-family="monospace" text-anchor="middle">Microsoft Azure</text>
  </g>
  <g transform="translate(440, 500)">
    <rect width="160" height="36" rx="8" fill="#1e293b" />
    <text x="80" y="23" fill="#cbd5e1" font-size="14" font-family="monospace" text-anchor="middle">Architecture</text>
  </g>
  <g transform="translate(615, 500)">
    <rect width="140" height="36" rx="8" fill="#1e293b" />
    <text x="70" y="23" fill="#cbd5e1" font-size="14" font-family="monospace" text-anchor="middle">RAG / LLMs</text>
  </g>
</svg>

